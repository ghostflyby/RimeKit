name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 格式门禁:swift-format 默认规则(--strict 即 error)
  format:
    name: swift-format lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift-format lint
        run: xcrun swift-format lint --strict --recursive Sources Tests


  # macOS 全量测试:双后端参数化(进程内 / 进程内 XPC 连接对)65 项
  macos-test:
    name: macOS · swift test
    runs-on: macos-latest # macos-26 arm64,Xcode 26.x(swift-tools 6.2 需要)
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --no-parallel

  # iOS 目的地构建:swift 构建引擎(destination)——与 macOS 同一构建器;
  # 插件工具按消费上下文在宿主构建运行(实证:编译数据进目的地 bundle)
  ios-build:
    name: iOS · build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate iOS destination
        run: |
          SDK=$(xcrun -sdk iphonesimulator -show-sdk-path)
          BIN=$(dirname "$(xcrun --find swiftc)")
          cat > "$RUNNER_TEMP/dest-ios.json" <<EOF
          {
            "version": 1,
            "target": "arm64-apple-ios16.0-simulator",
            "sdk": "$SDK",
            "toolchain-bin-dir": "$BIN",
            "extra-cc-flags": [],
            "extra-swiftc-flags": [],
            "extra-cpp-flags": []
          }
          EOF
          echo "DEST_IOS=$RUNNER_TEMP/dest-ios.json" >> "$GITHUB_ENV"
      - name: swift build (含测试目标)
        run: swift build --build-tests --destination "$DEST_IOS"

  # iOS 目的地 swift test:构建阶段同上;运行阶段 SwiftPM 能否执行,观察中
  ios-test:
    name: iOS · simulator test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate iOS destination
        run: |
          SDK=$(xcrun -sdk iphonesimulator -show-sdk-path)
          BIN=$(dirname "$(xcrun --find swiftc)")
          cat > "$RUNNER_TEMP/dest-ios.json" <<EOF
          {
            "version": 1,
            "target": "arm64-apple-ios16.0-simulator",
            "sdk": "$SDK",
            "toolchain-bin-dir": "$BIN",
            "extra-cc-flags": [],
            "extra-swiftc-flags": [],
            "extra-cpp-flags": []
          }
          EOF
          echo "DEST_IOS=$RUNNER_TEMP/dest-ios.json" >> "$GITHUB_ENV"
      - name: swift test
        run: swift test --destination "$DEST_IOS" --no-parallel
