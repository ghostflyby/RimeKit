name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 格式门禁:swift-format 默认规则(--strict 即 error)
  format:
    name: swift-format lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift-format lint
        run: xcrun swift-format lint --strict --recursive Sources Tests


  # macOS 全量测试:双后端参数化(进程内 / 进程内 XPC 连接对)65 项
  macos-test:
    name: macOS · swift test
    runs-on: macos-latest # macos-26 arm64,Xcode 26.x(swift-tools 6.2 需要)
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --no-parallel

  # iOS 目标构建:库 + 测试目标(iOS 16 地板;generic 目的地无需模拟器设备)
  # scheme 用 -Package 聚合:product 矩阵后 Xcode 按产物各自生成 scheme,
  # 同名产品 scheme 不含测试动作(测试动作为空,xcodebuild test 直接报错)。
  ios-build:
    name: iOS · build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild build-for-testing (generic iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme RimeKit-Package \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1

  # iOS 模拟器运行测试(设备 id 运行时发现,抗模拟器名称/OS 漂移)
  ios-test:
    name: iOS · simulator test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme RimeKit-Package \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -skip-testing:RimeDeployPluginTests \
            -parallel-testing-enabled NO \
            -skipMacroValidation -skipPackagePluginValidation \
            2>&1
      # ↑ RimeDeployPluginTests 在 iOS 模拟器上跳过(Xcode 26.6/iOS 26.2 runner
      #   引导期静默退出码 1,xcresult 钉死 target;Xcode 27 本地全绿)。迁回后
      #   插件工具为源码构建 target,疑触发该栈的 runner 准备缺陷;macOS 全量
      #   覆盖插件+工具逻辑,iOS 保留引擎 81 项 + 工具占位。待上游排查后回收。
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          XCR=$(ls -td ~/Library/Developer/Xcode/DerivedData/RimeKit-*/Logs/Test/*.xcresult 2>/dev/null | head -1)
          if [ -n "$XCR" ]; then
            echo "xcresult: $XCR"
            cp -R "$XCR" diagnostics/ || true
            xcrun xcresulttool get test-results summary --path "$XCR" \
              > diagnostics/test-summary.json 2>&1 || true
          fi
          cp ~/Library/Logs/DiagnosticReports/*.ips diagnostics/ 2>/dev/null || true
          ls -la diagnostics
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-diagnostics
          path: diagnostics
          if-no-files-found: warn
      - name: Failure diagnostics dump
        if: failure()
        run: |
          XCR=$(ls -td ~/Library/Developer/Xcode/DerivedData/RimeKit-*/Logs/Test/*.xcresult 2>/dev/null | head -1)
          echo "== xcresult: $XCR =="
          xcrun xcresulttool get test-results summary --path "$XCR" || true
          echo "== DiagnosticReports =="
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -4); do
            echo "===== $f ====="
            cat "$f"
          done
