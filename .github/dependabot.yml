version: 2
updates:
  # SwiftPM 依赖(Package.swift / Package.resolved)
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    groups:
      swift-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 工作流引用的 action(不分组:major 单独出 PR,便于逐个审)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
